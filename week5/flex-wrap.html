<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex wrap</title>
    <style>
        * {
            box-sizing: border-box;
        }

        #main {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        #main div {
            width: calc(100% / 6 - calc(30px / 5));
            height: 50px;
            border: 1px solid #0080ff;
            background: #1fd1ae;
        }
    </style>

<body>
    <div id="main">
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>

        <div>D</div>

</body>
</head>

</html>
