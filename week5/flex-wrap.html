<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex wrap</title>
    <style>
        #main {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            text-align: center;
        }

        #main div {
            width: calc(100%/6);
            height: 50px;
            background: #1fd1ae;
        }

        @media (max-width: 430px) {
            #main div {
                width: calc(100%/2);
            }
        }
    </style>

<body>
    <div id="main">
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
    </div>
</body>
</head>

</html>
