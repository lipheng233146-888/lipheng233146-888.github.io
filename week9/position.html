<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position</title>
    <link rel="stylesheet" href="css/position.css">
</head>

<body>

    <div class="dashboard-container">
        <div class="image-wrapper">

            <img src="images/custom-img-11-copyright.jpg" alt="Executive talking on phone" class="main-image">

            <div class="card card-top-right">
                <div class="card-header">
                    <span class="percentage">87.2%</span>
                    <span class="arrow-icon">↑</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill"></div>
                </div>
                <p class="card-label">Revenue growth</p>
            </div>

            <div class="card card-bottom-left">
                <div class="experience-value">20+</div>
                <div class="divider"></div>
                <p class="card-label dark-text">Years of experience</p>
            </div>

        </div>
    </div>

</body>

</html>
