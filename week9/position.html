<!DOCTYPE html>
<html>

<head>
    <title>Position</title>
    <style>
        div.container {
            position: relative;
            width: 50%;
            height: 200px;
            border: 3px solid green;
            margin: auto;
        }

        div.box-1 {
            position: absolute;
            top: 20px;
            right: -80px;
            width: 120px;
            border: 3px solid red;
        }

        div.box-2 {
            position: absolute;
            bottom: 20px;
            left: -80px;
            width: 120px;
            border: 3px solid red;
        }
    </style>
</head>

<body>


    <div class="container">
        <div class="box-1">First Box</div>
        <div class="box-2">Second Box</div>
    </div>


</body>

</html>
