<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Button</title>
</head>
<style>
    button.b1 {
        background-color: #000000;
        border: none;
        color: white;
        padding: 15px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 20px;
        cursor: pointer;
    }

    button.b2 {
        background-color: rgb(6, 150, 6);
        border: none;
        border-radius: 15px;
        color: white;
        padding: 15px 30px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 15px;
        cursor: pointer;
    }

    button.b3 {
        background-color: rgb(255, 213, 0);
        border: none;
        border-radius: 30px;
        color: black;
        padding: 15px 80px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 20px;
        cursor: pointer;
    }

    button.b4 {
        background-color: #4CAF50;
        border: none;
        color: white;
        padding: 15px 25px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 10px 10px;
        cursor: pointer;
    }

    button.b5 {
        background-color: #ffffff;
        border: 2px solid #000000;
        color: black;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 10px 5px;
        cursor: pointer;
    }

    button.b6 {
        background-color: #000000;
        border: none;
        border-radius: 40px;
        color: white;
        padding: 15px 60px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 10px 5px;
        cursor: pointer;
    }

    button.b7 {
        background-color: #ffffff;
        border: 2px solid rgb(0, 106, 255);
        border-radius: 40px;
        color: rgb(0, 102, 255);
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 10px 5px;
        cursor: pointer;
    }
</style>

<body>
    <button type="button" class="b1">Request now</button>
    <button type="button" class="b2">Sign up</button>
    <button type="button" class="b3">Add to Cart</button>
    <button type="button" class="b4">Get Started</button>
    <button type="button" class="b5">Download</button>
    <button type="button" class="b6">Apply on company website</button>
    <button type="button" class="b7">Save</button>
</body>

</html>
